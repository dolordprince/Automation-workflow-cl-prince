<!DOCTYPE html>
<html>
<head>

<title>Prince AI Admin</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-black text-white p-10">

<h1 class="text-5xl font-bold mb-10">
Prince AI Admin
</h1>

<textarea
id="prompt"
class="w-full h-60 bg-zinc-900 p-5 rounded-xl"
placeholder="Describe website..."
></textarea>

<button
onclick="build()"
class="mt-5 px-10 py-4 bg-blue-600 rounded-xl"
>
Generate Website
</button>

<pre
id="output"
class="mt-10 bg-zinc-900 p-5 rounded-xl overflow-auto"
></pre>

<script>

async function build() {

  const prompt = document.getElementById("prompt").value

  const res = await fetch("/build", {
    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      prompt
    })
  })

  const data = await res.json()

  document.getElementById("output").innerText =
    JSON.stringify(data, null, 2)
}

</script>

</body>
</html>
